services:
  formbricks-postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sandbox_pg:/var/lib/postgresql/data

  formbricks-redis:
    image: redis:alpine
    restart: always

  formbricks-minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - sandbox_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  formbricks:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - formbricks-postgres
      - formbricks-redis
      - formbricks-minio
    ports:
      - "3000:3000"
    volumes:
      - sandbox_uploads:/uploads
    env_file: .env.sandbox

volumes:
  sandbox_pg:
    external: true
  sandbox_uploads:
    external: true
  sandbox_minio:
    external: true
